<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AVA Practice Operating System</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#122036; --navy-2:#1B2E4A; --navy-3:#243A5C;
  --blue:#2F6FED; --blue-dark:#1E54C4; --blue-soft:#EAF1FE;
  --bg:#F4F6F9; --card:#FFFFFF; --border:#E3E7EE;
  --ink:#131C2B; --ink-soft:#5B6B80; --ink-faint:#93A0B2;
  --green:#0F8F5C; --green-soft:#E4F6EE;
  --amber:#B4740E; --amber-soft:#FCF0DC;
  --shadow: 0 1px 2px rgba(19,28,43,.05), 0 8px 24px rgba(19,28,43,.06);
}
html,body{height:100%}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
  overflow-x:hidden}
.mono{font-family:'JetBrains Mono',monospace}
a{color:inherit}
button{font-family:inherit}

.shell{min-height:100%}

/* ================= SIDEBAR ================= */
.sidebar{background:var(--navy);color:#fff;display:flex;flex-direction:column;
  position:fixed;top:0;left:0;bottom:0;width:272px;z-index:20;overflow-y:auto;
  border-right:1px solid rgba(255,255,255,.06)}
.brand{display:flex;align-items:center;gap:11px;padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-mark{width:36px;height:36px;border-radius:8px;background:linear-gradient(150deg,var(--blue),var(--blue-dark));
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;letter-spacing:.02em;flex:none}
.brand-name{font-size:14px;font-weight:700;line-height:1.25}
.brand-sub{font-size:10.5px;color:#8CA0BC;margin-top:1px}

.side-block{padding:16px 16px 4px}
.side-search{position:relative}
.side-search input{width:100%;padding:9px 12px 9px 34px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  border-radius:7px;color:#fff;font-size:12.5px;outline:none;transition:all .15s}
.side-search input::placeholder{color:#7488A3}
.side-search input:focus{background:rgba(255,255,255,.12);border-color:var(--blue)}
.side-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:#7488A3;fill:none;stroke-width:2}

.side-filters{display:flex;gap:6px;padding:12px 16px 6px}
.sf-btn{flex:1;padding:7px 4px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:transparent;
  color:#9FB0C6;font-size:10.5px;font-weight:600;letter-spacing:.02em;cursor:pointer;transition:all .15s}
.sf-btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.sf-btn:not(.on):hover{background:rgba(255,255,255,.06);color:#fff}

.nav-label{padding:14px 20px 6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#63779447}
.nav-label{color:#63779A}
.dept-nav{flex:1;overflow-y:auto;padding:2px 10px 10px}
.dept-nav::-webkit-scrollbar{width:6px}
.dept-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;cursor:pointer;
  margin-bottom:2px;border-left:3px solid transparent;transition:background .12s}
.nav-item:hover{background:rgba(255,255,255,.06)}
.nav-item.active{background:rgba(47,111,237,.18);border-left-color:var(--blue)}
.nav-dot{width:7px;height:7px;border-radius:50%;flex:none}
.nav-dot.active-st{background:var(--green)}
.nav-dot.inprocess-st{background:var(--amber)}
.nav-name{flex:1;min-width:0;font-size:12.5px;font-weight:500;color:#E4EAF2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item.active .nav-name{color:#fff;font-weight:600}
.nav-count{font-size:10px;color:#7488A3;font-weight:600}
.nav-empty{padding:16px 10px;font-size:12px;color:#7488A3;font-style:italic}
.nav-overview{display:flex;align-items:center;gap:10px;padding:10px 10px;margin:2px 10px 0;border-radius:7px;cursor:pointer;
  border-left:3px solid transparent;transition:background .12s}
.nav-overview:hover{background:rgba(255,255,255,.06)}
.nav-overview.active{background:rgba(47,111,237,.18);border-left-color:var(--blue)}
.nav-overview svg{width:14px;height:14px;stroke:#9FB0C6;fill:none;stroke-width:2}
.nav-overview span{font-size:12.5px;font-weight:600;color:#E4EAF2}

.side-footer{padding:14px 18px 18px;border-top:1px solid rgba(255,255,255,.08)}
.sync-row{display:flex;align-items:center;gap:7px;font-size:11px;color:#9FB0C6}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(15,143,92,.25);flex:none}
.resync{margin-top:10px;width:100%;padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,.14);
  background:transparent;color:#CBD6E4;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.resync:hover{background:rgba(255,255,255,.08);color:#fff}
.resync[disabled]{opacity:.5;cursor:wait}
.firm-line{margin-top:12px;font-size:9.5px;color:#5A6F8C;line-height:1.6}

.menu-toggle{display:none}

/* ================= MAIN ================= */
.main{min-width:0;display:flex;flex-direction:column;margin-left:272px}
.topbar{position:sticky;top:0;z-index:5;background:rgba(244,246,249,.9);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.crumb{font-size:11px;color:var(--ink-faint);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.page-title{font-size:19px;font-weight:700;margin-top:2px}
.top-search{flex:1;max-width:340px;position:relative;margin-left:auto}
.top-search input{width:100%;padding:9px 12px 9px 32px;border:1px solid var(--border);border-radius:7px;
  font-size:12.5px;outline:none;background:#fff}
.top-search input:focus{border-color:var(--blue)}
.top-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--ink-faint);fill:none;stroke-width:2}

.content-inner{padding:26px 32px 60px}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow)}
.stat-top{display:flex;align-items:center;justify-content:space-between}
.stat-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.stat-icon svg{width:15px;height:15px;stroke-width:2;fill:none}
.stat-n{font-size:26px;font-weight:800;margin-top:10px;letter-spacing:-.02em}
.stat-l{font-size:11px;color:var(--ink-soft);margin-top:2px;font-weight:500}

/* overview dept cards */
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-head h2{font-size:14px;font-weight:700}
.note{font-size:11.5px;color:var(--ink-faint)}
.dept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.dcard{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;cursor:pointer;
  box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.dcard:hover{border-color:var(--blue);transform:translateY(-2px)}
.dcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dcard-name{font-size:15px;font-weight:700}
.pill{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.active-st{background:var(--green-soft);color:var(--green)}
.pill.inprocess-st{background:var(--amber-soft);color:var(--amber)}
.dcard-purpose{font-size:12px;color:var(--ink-soft);margin-top:7px;line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dcard-meta{display:flex;gap:16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.dcard-meta div{font-size:11px}
.dcard-meta .k{color:var(--ink-faint)}
.dcard-meta .v{font-weight:700;color:var(--ink);margin-top:1px}

/* department detail */
.dhero{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:24px 26px;box-shadow:var(--shadow);margin-bottom:20px}
.dhero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.dhero h1{font-size:23px;font-weight:800;letter-spacing:-.01em}
.dhero-badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{font-size:10.5px;font-weight:700;padding:4px 11px;border-radius:999px}
.badge.freq{background:var(--blue-soft);color:var(--blue-dark)}
.dhero-purpose{margin-top:10px;font-size:13px;color:var(--ink-soft);line-height:1.6;max-width:720px}

.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px}
.person{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:14px 16px;box-shadow:var(--shadow)}
.person .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
.person .v{font-size:14.5px;font-weight:700;margin-top:4px}

.panel{background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
.panel-head{padding:14px 20px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel-head .cnt{font-size:11px;font-weight:600;color:var(--ink-faint)}
table{width:100%;border-collapse:collapse;font-size:12.8px}
th{background:#FAFBFD;text-align:left;padding:10px 20px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-faint);font-weight:700;border-bottom:1px solid var(--border)}
td{padding:12px 20px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:none}
td.pnum{color:var(--ink-faint);font-weight:600;width:32px}
td.pname{font-weight:700}
td.doer{color:var(--ink-soft);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;text-decoration:none;background:var(--blue-soft);
  color:var(--blue-dark);border-radius:5px;padding:4px 8px;font-size:10.5px;font-weight:600;transition:all .15s;white-space:nowrap}
.chip:hover{background:var(--blue);color:#fff}
.chip svg{width:10px;height:10px;stroke-width:2.4;fill:none}
td.resc{min-width:200px}
.nores-inline{color:var(--ink-faint)}
.nores{padding:16px 20px;font-size:12.5px;color:var(--ink-faint);font-style:italic}

.mark{background:#FDE9B8;border-radius:2px}
.empty{text-align:center;padding:70px 20px;color:var(--ink-soft)}
.empty .big{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:6px}
.loader{text-align:center;padding:120px 20px;color:var(--ink-soft);font-size:12.5px}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;
  margin:0 auto 18px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--blue);
  cursor:pointer;margin-bottom:14px;border:none;background:none}
.back-link svg{width:13px;height:13px;stroke:var(--blue);fill:none;stroke-width:2.4}

@media (max-width:900px){
  .main{margin-left:0}
  .sidebar{z-index:40;transform:translateX(-100%);transition:transform .22s}
  .sidebar.open{transform:translateX(0)}
  .menu-toggle{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:7px;
    border:1px solid var(--border);background:#fff;cursor:pointer}
  .menu-toggle svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2}
  .scrim{display:none;position:fixed;inset:0;background:rgba(19,28,43,.4);z-index:35}
  .scrim.show{display:block}
  .stats{grid-template-columns:repeat(2,1fr)}
  .top-search{max-width:none}
  .content-inner{padding:20px 16px 50px}
  .topbar{padding:14px 16px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">AVA</div>
      <div>
        <div class="brand-name">Practice OS</div>
        <div class="brand-sub">Aggarwal Vikram &amp; Associates</div>
      </div>
    </div>
    <div class="side-block">
      <div class="side-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        <input id="q" type="text" placeholder="Search departments…" autocomplete="off"></div>
    </div>
    <div class="side-filters">
      <button class="sf-btn on" data-f="all">All</button>
      <button class="sf-btn" data-f="active">Active</button>
      <button class="sf-btn" data-f="inprocess">In Process</button>
    </div>
    <div class="nav-overview active" id="overviewNav" onclick="selectDept(null)">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>Overview</span>
    </div>
    <div class="nav-label">Departments</div>
    <nav class="dept-nav" id="deptNav"></nav>
    <div class="side-footer">
      <div class="sync-row" id="syncstate"><span class="dot"></span>Connecting…</div>
      <button class="resync" id="syncbtn" onclick="load(true)">Sync now</button>
      <div class="firm-line">FRN 018491N · Internal System Master<br>For authorised firm personnel only</div>
    </div>
  </aside>
  <div class="scrim" id="scrim" onclick="toggleSidebar(false)"></div>

  <main class="main">
    <div class="topbar">
      <button class="menu-toggle" onclick="toggleSidebar(true)"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div>
        <div class="crumb" id="crumb">Dashboard</div>
        <div class="page-title" id="pageTitle">Overview</div>
      </div>
      <div class="top-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        <input id="q2" type="text" placeholder="Search processes, deliverables, names…" autocomplete="off"></div>
    </div>
    <div class="content-inner" id="content">
      <div class="loader"><div class="spin"></div>Loading the Master Sheet…</div>
    </div>
  </main>
</div>

<script>
// ================================================================
// CONFIGURE THIS: paste your deployed Apps Script Web App URL here.
// Deploy > New deployment > Web app > Execute as: Me > Who has access: Anyone
// The URL looks like: https://script.google.com/macros/s/AKfycb.../exec
// ================================================================
var APPS_SCRIPT_URL = 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';
// ================================================================

var DEPTS = [], filter = 'all', selected = null, term = '';

var esc = function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};
var code = function(i){return 'D-' + ('0'+(i+1)).slice(-2);};

var icoDept   = '<svg viewBox="0 0 24 24"><path d="M3 21V8l9-5 9 5v13M9 21v-6h6v6"/></svg>';
var icoProc   = '<svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>';
var icoLink   = '<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';
var icoLive   = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>';
var chipIco   = '<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';
var backIco   = '<svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>';
var extIco    = '<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"/></svg>';

var PROC_RES_ORDER = [
  { key:'flow',      label:'Flow' },
  { key:'fms',       label:'FMS' },
  { key:'checklist', label:'Checklist' },
  { key:'form',       label:'Form' }
];

// --- Data loading: calls your deployed Apps Script Web App URL directly ---
function load(force){
  var btn = document.getElementById('syncbtn');

  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_YOUR') > -1) {
    document.getElementById('content').innerHTML =
      '<div class="empty"><div class="big">Apps Script URL not configured</div>' +
      'Open index.html and set <code>APPS_SCRIPT_URL</code> near the top of the &lt;script&gt; tag ' +
      'to the Web app URL you got from Apps Script → Deploy → New deployment.</div>';
    return;
  }

  btn.disabled = true; btn.textContent = 'Syncing…';

  var sep = APPS_SCRIPT_URL.indexOf('?') > -1 ? '&' : '?';
  var url = APPS_SCRIPT_URL + sep + 'refresh=' + (force ? '1' : '0');

  fetch(url)
    .then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(res){
      if (res && res.error) throw new Error(res.message || 'Apps Script returned an error');
      DEPTS = res.depts || [];
      var t = new Date(res.synced);
      document.getElementById('syncstate').innerHTML =
        '<span class="dot"></span>Synced ' + t.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
      btn.disabled = false; btn.textContent = 'Sync now';
      renderNav();
      renderContent();
    })
    .catch(function(err){
      btn.disabled = false; btn.textContent = 'Retry sync';
      document.getElementById('content').innerHTML =
        '<div class="empty"><div class="big">The Master Sheet could not be read</div>' + esc(err && err.message) +
        '<br><br>Check that the Apps Script Web app is deployed with access "Anyone", ' +
        'that the deployment is on its latest version, and that APPS_SCRIPT_URL in index.html is correct.</div>';
    });
}

function toggleSidebar(open){
  document.getElementById('sidebar').classList.toggle('open', open);
  document.getElementById('scrim').classList.toggle('show', open);
}

function matches(d, t){
  if(!t) return true;
  var hay = [d.name,d.purpose,d.pc,d.solver,d.status]
    .concat(d.processes.map(function(p){return p.name+' '+p.result+' '+p.doer;}))
    .concat(d.resources.map(function(r){return r.label;})).join(' ').toLowerCase();
  return hay.indexOf(t) > -1;
}
function hl(text, t){
  var e = esc(text); if(!t) return e;
  var i = e.toLowerCase().indexOf(t); if(i<0) return e;
  return e.slice(0,i)+'<span class="mark">'+e.slice(i,i+t.length)+'</span>'+e.slice(i+t.length);
}

function renderNav(){
  var list = DEPTS.map(function(d,i){
    var st = /active/i.test(d.status) ? 'active' : 'inprocess';
    if(filter!=='all' && filter!==st) return '';
    if(!matches(d,term)) return '';
    return { i:i, d:d, st:st };
  }).filter(Boolean);

  document.getElementById('deptNav').innerHTML = list.length ? list.map(function(o){
    return '<div class="nav-item'+(selected===o.i?' active':'')+'" onclick="selectDept('+o.i+')">' +
      '<span class="nav-dot '+o.st+'-st"></span>' +
      '<span class="nav-name">'+esc(o.d.name)+'</span>' +
      '<span class="nav-count mono">'+o.d.processes.length+'</span></div>';
  }).join('') : '<div class="nav-empty">No matches</div>';

  document.getElementById('overviewNav').classList.toggle('active', selected===null);
}

function selectDept(i){
  selected = i;
  toggleSidebar(false);
  renderNav();
  renderContent();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderContent(){
  if(selected===null){ renderOverview(); return; }
  var d = DEPTS[selected];
  if(!d){ selected=null; renderOverview(); return; }
  renderDetail(d, selected);
}

function renderOverview(){
  document.getElementById('crumb').textContent = 'Dashboard';
  document.getElementById('pageTitle').textContent = 'Overview';

  var p = DEPTS.reduce(function(a,d){return a+d.processes.length;},0);
  var l = DEPTS.reduce(function(a,d){return a+d.resources.length;},0);
  var a = DEPTS.filter(function(d){return /active/i.test(d.status);}).length;

  var stats = '<div class="stats">' +
    statCard(icoDept, DEPTS.length, 'Departments', 'var(--blue-soft)', 'var(--blue-dark)') +
    statCard(icoProc, p, 'Mapped Processes', 'var(--blue-soft)', 'var(--blue-dark)') +
    statCard(icoLink, l, 'Linked Resources', 'var(--blue-soft)', 'var(--blue-dark)') +
    statCard(icoLive, a+' / '+DEPTS.length, 'Departments Live', 'var(--green-soft)', 'var(--green)') +
    '</div>';

  var list = DEPTS.map(function(d,i){
    var st = /active/i.test(d.status) ? 'active' : 'inprocess';
    if(filter!=='all' && filter!==st) return '';
    if(!matches(d,term)) return { skip:true };
    return { i:i, d:d, st:st };
  }).filter(function(x){return x && !x.skip;});

  var shown = list.length;
  var grid = shown ? list.map(function(o){
    var d=o.d;
    return '<article class="dcard" onclick="selectDept('+o.i+')">' +
      '<div class="dcard-top"><div class="dcard-name">'+hl(d.name,term)+'</div>' +
      '<span class="pill '+o.st+'-st">'+(o.st==='active'?'Active':'In Process')+'</span></div>' +
      '<div class="dcard-purpose">'+(esc(d.purpose)||'—')+'</div>' +
      '<div class="dcard-meta">' +
        '<div><div class="k">Coordinator</div><div class="v">'+(esc(d.pc)||'—')+'</div></div>' +
        '<div><div class="k">Processes</div><div class="v">'+d.processes.length+'</div></div>' +
        '<div><div class="k">Links</div><div class="v">'+d.resources.length+'</div></div>' +
      '</div></article>';
  }).join('') : '<div class="empty" style="grid-column:1/-1"><div class="big">No matching departments</div>Try a different search term or status filter.</div>';

  document.getElementById('content').innerHTML = stats +
    '<div class="section-head"><h2>All Departments</h2><span class="note">'+(term||filter!=='all' ? 'Showing '+shown+' of '+DEPTS.length : DEPTS.length+' total')+'</span></div>' +
    '<div class="dept-grid">'+grid+'</div>';
}

function statCard(icon, n, label, bg, fg){
  return '<div class="stat-card"><div class="stat-top"><div class="stat-icon" style="background:'+bg+';color:'+fg+'">'+icon+'</div></div>' +
    '<div class="stat-n">'+n+'</div><div class="stat-l">'+label+'</div></div>';
}

function procResLine(res){
  res = res || {};
  var parts = PROC_RES_ORDER.map(function(r){
    var item = res[r.key];
    if(!item || !item.url) return '';
    return '<a class="chip" href="'+esc(item.url)+'" target="_blank" rel="noopener">'+chipIco+esc(r.label)+'</a>';
  }).filter(Boolean);
  return parts.length ? '<div class="chips">'+parts.join('')+'</div>' : '';
}

function renderDetail(d, i){
  var st = /active/i.test(d.status) ? 'active' : 'inprocess';
  document.getElementById('crumb').textContent = 'Departments / ' + code(i);
  document.getElementById('pageTitle').textContent = d.name;

  var rows = d.processes.map(function(p,n){
    var line = procResLine(p.res);
    return '<tr><td class="pnum mono">'+('0'+(n+1)).slice(-2)+'</td>' +
      '<td class="pname">'+esc(p.name)+'</td><td>'+(esc(p.result)||'—')+'</td><td class="doer">'+(esc(p.doer)||'—')+'</td>' +
      '<td class="resc">'+(line || '<span class="nores-inline">—</span>')+'</td></tr>';
  }).join('');

  document.getElementById('content').innerHTML =
    '<button class="back-link" onclick="selectDept(null)">'+backIco+'Back to overview</button>' +
    '<div class="dhero"><div class="dhero-top">' +
      '<div><h1>'+esc(d.name)+'</h1></div>' +
      '<div class="dhero-badges"><span class="pill '+st+'-st">'+(st==='active'?'Active':'In Process')+'</span>' +
      (d.freq ? '<span class="badge freq">'+esc(d.freq)+'</span>' : '') + '</div></div>' +
      '<div class="dhero-purpose">'+esc(d.purpose)+'</div></div>' +
    '<div class="people">' +
      '<div class="person"><div class="k">Process Coordinator</div><div class="v">'+(esc(d.pc)||'—')+'</div></div>' +
      '<div class="person"><div class="k">Problem Solver</div><div class="v">'+(esc(d.solver)||'—')+'</div></div>' +
      '<div class="person"><div class="k">Ownership Access</div><div class="v">'+(esc(d.access)||'—')+'</div></div></div>' +
    '<div class="panel"><div class="panel-head">Process Registry <span class="cnt">'+d.processes.length+' processes</span></div>' +
      '<div style="overflow-x:auto"><table><thead><tr><th style="width:32px">No.</th><th>Process</th><th>Deliverable / Result</th><th>Doer</th><th>Resources</th></tr></thead>' +
      '<tbody>'+rows+'</tbody></table></div></div>';
}

document.getElementById('q').addEventListener('input', function(e){
  term = e.target.value.trim().toLowerCase();
  document.getElementById('q2').value = e.target.value;
  renderNav(); if(selected===null) renderOverview();
});
document.getElementById('q2').addEventListener('input', function(e){
  term = e.target.value.trim().toLowerCase();
  document.getElementById('q').value = e.target.value;
  renderNav(); if(selected===null) renderOverview();
});
document.querySelectorAll('.sf-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.sf-btn').forEach(function(b){b.classList.remove('on');});
    btn.classList.add('on'); filter = btn.getAttribute('data-f');
    renderNav(); if(selected===null) renderOverview();
  });
});

load(false);
</script>
</body>
</html>
